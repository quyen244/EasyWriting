openapi: 3.0.3
info:
  title: IELTS Writing Score Assessment API
  version: "1.0.0"
  description: >
    Covers this feature only (001-ielts-score-assessment): submitting an essay for scoring
    and viewing a previously scored result. Authentication is assumed to be handled by a
    shared prerequisite (see plan.md "auth dependency" note) and is represented here only as
    a bearer-token requirement.

paths:
  /api/v1/assessments:
    post:
      summary: Submit an essay for scoring (FR-001..FR-009, FR-012)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRequest'
      responses:
        '201':
          description: Essay scored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '400':
          description: >
            Submission could not be scored as-is (below minimum word count, or not
            recognizable as scoreable essay content). The learner's text is not discarded
            server-side or client-side (FR-006, FR-007, FR-009).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectionError'
        '401':
          description: No authenticated learner session (FR-008).
        '503':
          description: >
            Scoring pipeline failed (e.g. upstream LLM error). Safe to retry with the same
            payload (FR-009); the client is responsible for preserving the essay text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringFailureError'

  /api/v1/assessments/{submissionId}:
    get:
      summary: View a previously produced assessment result (FR-010)
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The assessment result for this submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '401':
          description: No authenticated learner session.
        '403':
          description: Submission belongs to a different learner.
        '404':
          description: No submission with this id, or it was rejected/failed (has no result).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    AssessmentRequest:
      type: object
      required: [task_type, essay_text]
      properties:
        task_type:
          type: string
          enum: [TASK_1, TASK_2]
          description: Which rubric to apply (FR-005, FR-005a).
        prompt_text:
          type: string
          nullable: true
          description: The exam prompt/topic the essay responds to, if available.
        essay_text:
          type: string
          minLength: 1

    AssessmentResult:
      type: object
      required: [submission_id, overall_band, criteria, created_at]
      properties:
        submission_id:
          type: string
          format: uuid
        overall_band:
          type: number
          format: float
          minimum: 1
          maximum: 9
        criteria:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/CriterionScore'
        created_at:
          type: string
          format: date-time

    CriterionScore:
      type: object
      required: [criterion, band, explanation, evidence_quotes]
      properties:
        criterion:
          type: string
          enum:
            - TASK_ACHIEVEMENT
            - TASK_RESPONSE
            - COHERENCE_COHESION
            - LEXICAL_RESOURCE
            - GRAMMATICAL_RANGE_ACCURACY
        band:
          type: number
          format: float
          minimum: 1
          maximum: 9
        explanation:
          type: string
          description: Plain-language explanation citing specific band-descriptor language (FR-004).
        evidence_quotes:
          type: array
          items:
            type: string
          description: Verbatim passages from the learner's own essay (User Story 2).

    RejectionError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [BELOW_MIN_WORDS, UNSCOREABLE]
        message:
          type: string
        minimum_words:
          type: integer
          description: Present only when error = BELOW_MIN_WORDS.

    ScoringFailureError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [SCORING_FAILED]
        message:
          type: string
