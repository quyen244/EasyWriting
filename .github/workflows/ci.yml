# CI.
#
# The Postgres service, migration check and Docker image build were removed in constitution
# v3.0.0 along with the self-hosted backend: `eval/` owns no database and serves no HTTP, and
# the frontend deploys via Vercel rather than a container.
#
# No API key is configured and none is needed: every test injects FakeLLMClient, so the
# suite makes zero upstream calls and costs nothing to run (Constitution III + V).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval

    env:
      PIPELINE_CONFIG: pipelines/v1.yaml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check src tests

      - name: Run tests
        run: pytest -q

      - name: Benchmark harness smoke test
        # Proves the Principle IV evaluation path still runs, without API spend.
        run: python -m src.evaluation.harness --fake --limit 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      - name: Component tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # The backend is stubbed at the network boundary (tests/e2e/support/backend.ts),
        # so these need no database and no API key — see playwright.config.ts for why.
        # `next build` runs as part of the Playwright webServer command.
        run: npm run test:e2e

      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high
