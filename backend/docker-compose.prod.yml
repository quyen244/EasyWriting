# Production overlay (T045). Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from local development, all of them deliberate:
#   * Postgres is NOT published to the host — only the backend reaches it over the
#     compose network. In dev it is exposed on 5433 so psql/alembic can connect.
#   * Secrets come from the environment, never from a committed file. `${VAR:?message}`
#     makes compose refuse to start rather than silently using a default in production.
#   * Containers run read-only with no privilege escalation (Constitution VII).

services:
  postgres:
    ports: !override [] # do not publish the database to the host in production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-writewise}
    restart: always
    security_opt:
      - no-new-privileges:true

  backend:
    restart: always
    env_file: !override []
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-writewise}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY to a long random value}
      PIPELINE_CONFIG: ${PIPELINE_CONFIG:-pipelines/v1.yaml}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?set the exact frontend origin}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # Benchmark artifacts are the only thing the app writes (Constitution IV).
    volumes: !override
      - ./data/reports:/app/data/reports
    deploy:
      resources:
        limits:
          memory: 1g
